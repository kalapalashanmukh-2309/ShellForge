name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test test-web
      - name: Address and undefined-behavior sanitizers
        if: runner.os == 'Linux'
        run: make asan-test CC=clang
      - name: Check browser JavaScript
        run: node --check web/static/app.js
